name: Build and release (Windows)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run fetch-web
      - name: Google OAuth desktop client (optional secret)
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            printf '{"client_id":"%s","client_secret":"%s"}\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > src/oauth-client.json
            echo "Google desktop client configured"
          else
            echo "No GOOGLE_DESKTOP_CLIENT_ID secret - Drive sign-in will show 'not set up'"
          fi
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish GitHub Release (installer, latest.yml, blockmap)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME}"
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "PrintCaddy ${V#v}" --notes "PrintCaddy for Windows ${V#v}. Download PrintCaddy-Setup-${V#v}.exe below. Unsigned installer: if SmartScreen appears, click More info -> Run anyway."
          gh release upload "$V" release/PrintCaddy-Setup-*.exe release/PrintCaddy-Setup-*.exe.blockmap release/latest.yml --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
